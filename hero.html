<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero | MCU Baseline Fan Hub</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    background:#020307;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

/* HERO IMAGE */
.hero-bg{
    position:fixed;
    inset:0;
    z-index:0;

    background-size:contain;
    background-position:center center;
    background-repeat:no-repeat;

    background-color:#020307;

    filter:brightness(.48);
    transform:scale(1);
}

/* DARK OVERLAY */
.hero-bg::after{
    content:"";
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.88) 0%,
            rgba(0,0,0,.55) 42%,
            rgba(0,0,0,.18) 100%
        ),
        linear-gradient(
            0deg,
            rgba(0,0,0,.85),
            transparent 65%
        );
}

/* LIGHT */
.light{
    position:fixed;
    width:500px;
    height:500px;

    border-radius:50%;

    background:rgba(0,180,255,.08);

    filter:blur(80px);

    top:-200px;
    right:-150px;

    z-index:1;

    animation:pulse 4s infinite alternate;
}

@keyframes pulse{
    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.25);
    }
}

/* HEADER */
header{
    position:relative;
    z-index:10;

    height:72px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 6%;

    background:rgba(0,0,0,.4);

    border-bottom:1px solid rgba(255,255,255,.1);

    backdrop-filter:blur(12px);
}

.logo{
    font-size:18px;
    font-weight:900;
    letter-spacing:2px;
}

.back{
    color:white;
    text-decoration:none;

    padding:10px 18px;

    border:1px solid rgba(255,255,255,.3);

    border-radius:30px;

    font-size:12px;
    font-weight:bold;
    letter-spacing:1px;

    transition:.3s;
}

.back:hover{
    background:white;
    color:black;
}

/* CONTENT */
.content{
    position:relative;
    z-index:5;

    min-height:calc(100vh - 72px);

    display:flex;
    align-items:center;

    padding:60px 8%;
}

.info{
    width:min(650px,100%);
}

.tag{
    color:#67dfff;

    font-size:12px;
    font-weight:bold;

    letter-spacing:4px;

    margin-bottom:18px;
}

h1{
    font-size:clamp(48px,9vw,100px);

    line-height:.9;

    letter-spacing:-3px;

    margin-bottom:22px;

    text-shadow:0 0 35px rgba(255,255,255,.15);
}

.description{
    color:#d0d5df;

    font-size:16px;

    line-height:1.7;

    max-width:600px;

    margin-bottom:25px;
}

.abilities{
    display:flex;
    flex-wrap:wrap;

    gap:9px;

    margin-bottom:32px;
}

.ability{
    padding:9px 14px;

    border-radius:20px;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.14);

    color:#dce2ec;

    font-size:12px;
}

/* MOVIES BUTTON */
.movies{
    display:inline-flex;

    align-items:center;

    gap:12px;

    padding:15px 23px;

    border-radius:30px;

    background:white;

    color:black;

    text-decoration:none;

    font-weight:900;

    font-size:13px;

    letter-spacing:1px;

    transition:.3s;
}

.movies:hover{
    transform:translateY(-3px);

    box-shadow:
        0 10px 35px rgba(255,255,255,.25);
}

/* POWER EFFECT */
.power{
    position:fixed;

    z-index:3;

    pointer-events:none;
}

.hidden{
    display:none;
}

/* IRON MAN */
.repulsor{
    width:170px;
    height:170px;

    border-radius:50%;

    border:3px solid rgba(80,210,255,.7);

    box-shadow:
        0 0 20px #5edcff,
        0 0 70px rgba(50,180,255,.7),
        inset 0 0 40px rgba(50,200,255,.5);

    right:12%;
    bottom:22%;

    animation:repulse 1.2s infinite alternate;
}

.repulsor::after{
    content:"";

    position:absolute;

    width:35px;
    height:35px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 20px #5edcff,
        0 0 60px #39cfff;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);
}

@keyframes repulse{
    from{
        transform:scale(.8);
        opacity:.55;
    }

    to{
        transform:scale(1.15);
        opacity:1;
    }
}

/* SPIDER */
.web{
    width:230px;
    height:230px;

    right:10%;
    bottom:18%;

    border-radius:50%;

    background:
        repeating-radial-gradient(
            circle,
            transparent 0 22px,
            rgba(255,255,255,.8) 23px 25px
        );

    opacity:.5;

    animation:spin 5s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* CAPTAIN */
.shield{
    width:170px;
    height:170px;

    right:12%;
    bottom:20%;

    border-radius:50%;

    border:15px solid #dce4ed;

    box-shadow:
        0 0 0 15px #b8202b,
        0 0 0 30px #dce4ed,
        0 0 45px rgba(255,255,255,.5);

    animation:shieldSpin 4s linear infinite;
}

.shield::after{
    content:"★";

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    color:white;

    font-size:55px;
}

@keyframes shieldSpin{
    to{
        transform:rotate(360deg);
    }
}

/* THOR */
.lightning{
    width:8px;
    height:300px;

    right:22%;
    top:25%;

    background:#bdefff;

    box-shadow:
        0 0 20px #65dfff,
        0 0 60px #2bbfff;

    transform:rotate(18deg);

    animation:flash .8s infinite;
}

@keyframes flash{
    0%,100%{
        opacity:.1;
    }

    20%{
        opacity:1;
    }

    30%{
        opacity:.2;
    }

    50%{
        opacity:.9;
    }
}

/* HULK */
.hulkPower{
    width:260px;
    height:260px;

    right:8%;
    bottom:15%;

    border-radius:50%;

    background:rgba(70,255,90,.12);

    box-shadow:
        0 0 100px rgba(60,255,80,.45);

    animation:hulkPulse 1.3s infinite alternate;
}

@keyframes hulkPulse{
    from{
        transform:scale(.8);
    }

    to{
        transform:scale(1.2);
    }
}

/* DOCTOR STRANGE */
.magic{
    width:210px;
    height:210px;

    right:9%;
    bottom:17%;

    border:5px solid #ff8b28;

    border-radius:50%;

    box-shadow:
        0 0 20px #ff8b28,
        0 0 60px rgba(255,90,20,.6);

    animation:magicSpin 3s linear infinite;
}

.magic::before,
.magic::after{
    content:"";

    position:absolute;

    inset:20px;

    border:2px solid #ffca55;

    border-radius:50%;
}

.magic::after{
    inset:45px;
}

@keyframes magicSpin{
    to{
        transform:rotate(360deg);
    }
}

/* WANDA */
.wanda{
    width:260px;
    height:260px;

    right:8%;
    bottom:12%;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,20,90,.7),
            rgba(180,0,60,.2),
            transparent 70%
        );

    filter:blur(4px);

    animation:wandaPower 1s infinite alternate;
}

@keyframes wandaPower{
    from{
        transform:scale(.7);
    }

    to{
        transform:scale(1.3);
    }
}

/* LOKI */
.loki{
    width:230px;
    height:230px;

    right:10%;
    bottom:15%;

    border-radius:50%;

    border:4px solid #40ff9a;

    box-shadow:
        0 0 25px #40ff9a,
        0 0 80px rgba(0,255,100,.5);

    animation:magicSpin 5s linear infinite reverse;
}

/* MOBILE */
@media(max-width:700px){

    .hero-bg{
        background-size:contain;
        background-position:center center;
    }

    header{
        height:64px;
        padding:0 5%;
    }

    .logo{
        font-size:14px;
    }

    .back{
        font-size:10px;
        padding:8px 13px;
    }

    .content{
        min-height:calc(100vh - 64px);

        padding:50px 7%;

        align-items:flex-start;

        padding-top:80px;
    }

    h1{
        font-size:58px;
        letter-spacing:-2px;
    }

    .description{
        font-size:14px;
    }

    .power{
        right:-30px;
        bottom:8%;
        opacity:.45;
    }

    .repulsor,
    .shield{
        width:130px;
        height:130px;
    }

    .magic,
    .loki,
    .web,
    .hulkPower,
    .wanda{
        width:180px;
        height:180px;
    }
}
</style>
</head>

/* GET HERO */

    new URLSearchParams(window.location.search);

    params.get("hero");


/* ELEMENTS */

const heroDescription =
    document.getElementById("heroDescription");

const heroBg =
    document.getElementById("heroBg");

const abilities =
    document.getElementById("abilities");

const moviesButton =
    document.getElementById("moviesButton");


/* LOAD HERO */

if(heroKey && heroes[heroKey]){

    const hero =
        heroes[heroKey];

    heroName.textContent =
        hero.name;

    heroDescription.textContent =
        hero.description;

    heroBg.style.backgroundImage =
        "url('" + hero.image + "')";

    abilities.innerHTML = "";

    hero.abilities.forEach(function(item){

        const ability =
            document.createElement("div");

        ability.className =
            "ability";

        ability.textContent =
            item;

        abilities.appendChild(
            ability
        );

    });

        "movies.html?hero=" +
        encodeURIComponent(heroKey);

        const effect =
            document.getElementById(
                hero.effect
            );

                "hidden"
