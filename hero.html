<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCU Baseline | Hero Profile</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#05070d;color:white;
 font-family:Arial,Helvetica,sans-serif;
 min-height:100vh;overflow-x:hidden
}
.hero-bg{
 position:fixed;inset:0;
 background-position:center;background-size:cover;
 background-repeat:no-repeat;
 filter:brightness(.28);z-index:-2;
 transition:background-image .4s
}
.overlay{
 position:fixed;inset:0;
 background:linear-gradient(90deg,#03050af5,#03050a8c,#03050aee);
 z-index:-1
}
header{
 display:flex;justify-content:space-between;align-items:center;
 padding:18px 6%;border-bottom:1px solid #ffffff22;
 background:#05070dbb
}
.brand{font-size:17px;font-weight:900;letter-spacing:2px;color:#ff3030}
a{color:white;text-decoration:none}
.back{
 border:1px solid #ffffff55;padding:10px 15px;
 border-radius:8px;font-size:13px
}
main{
 width:min(1100px,90%);margin:0 auto;
 min-height:80vh;display:flex;align-items:center;padding:45px 0
}
.content{max-width:680px}
.tag{color:#ff4242;letter-spacing:4px;font-size:12px;font-weight:bold}
h1{font-size:clamp(42px,9vw,90px);margin:14px 0;text-transform:uppercase}
.desc{font-size:17px;line-height:1.7;color:#d0d4df}
h3{letter-spacing:2px;color:#ff4242}
.powers{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}
.power{
 border:1px solid #ffffff38;background:#ffffff0b;
 border-radius:20px;padding:9px 13px;font-size:13px
}
.btn{
 display:inline-block;background:#e62429;padding:14px 22px;
 border-radius:8px;font-weight:bold;margin:12px 8px 0 0
}
.secondary{background:#ffffff12;border:1px solid #ffffff40}
.status{color:#aeb5c6;font-size:13px;margin-top:24px}
@media(max-width:600px){
 header{padding:16px 5%}
 main{width:90%;padding:35px 0}
 .desc{font-size:15px}
}
</style>
</head>
<body>

<div class="hero-bg" id="heroBg"></div>
<div class="overlay"></div>

<header>
 <div class="brand">MCU BASELINE</div>
 <a class="back" href="hub.html">← BACK TO HUB</a>
</header>

<main>
 <section class="content">
  <div class="tag">MARVEL HERO DATABASE</div>
  <h1 id="heroName">LOADING...</h1>
  <p class="desc" id="heroDescription">Loading hero information...</p>
  <h3>ABILITIES</h3>
  <div class="powers" id="heroPowers"></div>
  <a class="btn" id="moviesButton" href="movies.html">EXPLORE MOVIES</a>
  <a class="btn secondary" href="hub.html">ALL HEROES</a>
  <p class="status" id="status">MCU BASELINE • HERO PROFILE</p>
 </section>
</main>

<script>
const heroes = {
 iron: {
  name:"Iron Man", image:"iron-man.jpg",
  desc:"Genius inventor Tony Stark uses advanced armor and technology to protect the world.",
  powers:["Powered Armor","Repulsor Technology","Flight","Genius Inventor"]
 },
 spider: {
  name:"Spider-Man", image:"spider-man.jpg",
  desc:"A young hero with spider-like abilities who protects people with courage and responsibility.",
  powers:["Web Shooting","Spider-Sense","Wall Crawling","Agility"]
 },
 captain: {
  name:"Captain America", image:"captain-america.jpg",
  desc:"A super-soldier known for his courage, leadership and iconic shield.",
  powers:["Vibranium Shield","Super Soldier","Leadership","Combat"]
 },
 thor: {
  name:"Thor", image:"thor.jpg",
  desc:"The Asgardian God of Thunder commands lightning and wields mighty weapons.",
  powers:["Lightning","Super Strength","Storm Control","Mjolnir"]
 },
 hulk: {
  name:"Hulk", image:"hulk.jpg",
  desc:"Bruce Banner transforms into a powerful hero with extraordinary strength.",
  powers:["Super Strength","Durability","Powerful Leaps","Gamma Power"]
 },
 blackwidow: {
  name:"Black Widow", image:"black-widow.jpg",
  desc:"A highly skilled spy and fighter who uses strategy, stealth and precision.",
  powers:["Espionage","Martial Arts","Tactical Skills","Stealth"]
 },
 shehulk: {
  name:"She-Hulk", image:"she-hulk.jpg",
  desc:"Jennifer Walters balances her legal career with extraordinary gamma-powered abilities.",
  powers:["Super Strength","Durability","Combat","Gamma Power"]
 },
 strange: {
  name:"Doctor Strange", image:"doctor-strange.jpg",
  desc:"A master of the mystic arts who protects reality from supernatural threats.",
  powers:["Mystic Arts","Portals","Energy Shields","Magic"]
 },
 panther: {
  name:"Black Panther", image:"black-panther.jpg",
  desc:"The protector of Wakanda combines advanced technology with exceptional combat skills.",
  powers:["Vibranium Suit","Agility","Combat","Wakandan Technology"]
 },
 wanda: {
  name:"Scarlet Witch", image:"wanda.jpg",
  desc:"Wanda Maximoff wields powerful chaos magic and reality-altering abilities.",
  powers:["Chaos Magic","Telekinesis","Energy Projection","Reality Magic"]
 },
 loki: {
  name:"Loki", image:"loki.jpg",
  desc:"The God of Mischief uses magic, illusions and clever strategy.",
  powers:["Illusions","Sorcery","Shapeshifting","Trickery"]
 }
};

const params = new URLSearchParams(window.location.search);
const key = params.get("hero") || "iron";
const hero = heroes[key];

if (hero) {
 document.title = hero.name + " | MCU Baseline";
 document.getElementById("heroName").textContent = hero.name;
 document.getElementById("heroDescription").textContent = hero.desc;
 document.getElementById("heroPowers").innerHTML =
  hero.powers.map(power => `<span class="power">${power}</span>`).join("");
 document.getElementById("heroBg").style.backgroundImage =
  `url("${hero.image}")`;
 document.getElementById("moviesButton").href =
  `movies.html?hero=${encodeURIComponent(key)}`;
 document.getElementById("status").textContent =
  "PROFILE LOADED • " + hero.name.toUpperCase();
} else {
 document.getElementById("heroName").textContent = "HERO NOT FOUND";
 document.getElementById("heroDescription").textContent =
  "Return to the hub and select a valid hero.";
 document.getElementById("heroPowers").innerHTML = "";
 document.getElementById("status").textContent =
  "Unknown hero key: " + key;
}
</script>
</body>
</html>
