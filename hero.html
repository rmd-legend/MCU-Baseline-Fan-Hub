<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>MCU Hero</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  background:#020305;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
}

/* MAIN */
.hero-page{
  position:relative;
  width:100%;
  height:100vh;
  height:100svh;
  overflow:hidden;
}

/* HERO IMAGE */
.hero-image{
  position:absolute;
  inset:0;
  z-index:0;

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;

  transform:scale(1.03);

  animation:heroZoom 12s ease-in-out infinite alternate;
}

@keyframes heroZoom{
  from{transform:scale(1.03);}
  to{transform:scale(1.09);}
}

/* DARK CINEMATIC OVERLAY */
.overlay{
  position:absolute;
  inset:0;
  z-index:1;

  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.88),
      rgba(0,0,0,.45),
      rgba(0,0,0,.12)
    ),
    linear-gradient(
      0deg,
      rgba(0,0,0,.92),
      transparent 65%
    );
}

/* TOP */
.top{
  position:absolute;
  top:0;
  left:0;
  right:0;

  z-index:20;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:20px;
}

.logo{
  font-size:12px;
  letter-spacing:3px;
  font-weight:bold;
}

.back{
  color:white;
  text-decoration:none;

  padding:10px 18px;

  border:1px solid rgba(255,255,255,.3);
  border-radius:25px;

  background:rgba(0,0,0,.45);

  backdrop-filter:blur(10px);
}

/* CONTENT */
.content{
  position:absolute;

  z-index:10;

  left:0;
  bottom:0;

  width:100%;

  padding:60px;

  padding-bottom:70px;
}

.tag{
  color:#20d9ff;

  font-size:12px;

  letter-spacing:5px;

  margin-bottom:15px;

  font-weight:bold;
}

h1{
  font-size:clamp(55px,11vw,120px);

  line-height:.88;

  letter-spacing:4px;

  margin-bottom:20px;

  text-shadow:
    0 5px 30px #000;

  animation:titleIn 1.2s ease;
}

.description{
  max-width:560px;

  color:#dce5ee;

  font-size:16px;

  line-height:1.7;
}

.stats{
  display:flex;

  flex-wrap:wrap;

  gap:10px;

  margin-top:25px;
}

.stat{
  min-width:115px;

  padding:12px 16px;

  border-radius:14px;

  background:rgba(5,8,12,.65);

  border:1px solid rgba(255,255,255,.16);

  backdrop-filter:blur(8px);
}

.stat small{
  display:block;

  color:#9ca9b8;

  font-size:9px;

  letter-spacing:2px;

  margin-bottom:5px;
}

.stat strong{
  font-size:13px;
}

/* =========================
   ENERGY EFFECT
========================= */

.energy{
  position:absolute;

  z-index:5;

  width:150px;
  height:150px;

  border-radius:50%;

  pointer-events:none;

  opacity:.85;
}

/* ENERGY CORE */
.energy::before{
  content:"";

  position:absolute;

  inset:35%;

  border-radius:50%;

  background:white;

  box-shadow:
    0 0 15px white,
    0 0 35px #00d9ff,
    0 0 70px #00aaff,
    0 0 120px #008cff;

  animation:energyPulse .8s infinite alternate;
}

/* ENERGY RINGS */
.energy::after{
  content:"";

  position:absolute;

  inset:15%;

  border-radius:50%;

  border:2px solid rgba(0,220,255,.7);

  box-shadow:
    0 0 25px #00cfff;

  animation:energyRing 1.2s linear infinite;
}

@keyframes energyPulse{
  from{
    transform:scale(.8);
  }

  to{
    transform:scale(1.15);
  }
}

@keyframes energyRing{
  from{
    transform:scale(.7) rotate(0deg);
    opacity:.9;
  }

  to{
    transform:scale(1.5) rotate(360deg);
    opacity:0;
  }
}

/* LIGHT RAYS */
.rays{
  position:absolute;

  inset:0;

  border-radius:50%;

  background:
    conic-gradient(
      from 0deg,
      transparent,
      rgba(0,210,255,.6),
      transparent 12%,
      transparent 25%,
      rgba(0,210,255,.4),
      transparent 38%,
      transparent 55%,
      rgba(0,210,255,.5),
      transparent 70%
    );

  filter:blur(2px);

  animation:raySpin 2s linear infinite;
}

@keyframes raySpin{
  to{
    transform:rotate(360deg);
  }
}


/* =========================
   THOR LIGHTNING
========================= */

.lightning{
  position:absolute;

  width:4px;
  height:180px;

  background:white;

  box-shadow:
    0 0 10px white,
    0 0 25px #4db8ff,
    0 0 60px #008cff;

  clip-path:polygon(
    45% 0,
    100% 0,
    65% 40%,
    100% 40%,
    25% 100%,
    42% 55%,
    0 55%
  );

  opacity:0;

  animation:lightningFlash 2s infinite;
}

@keyframes lightningFlash{

  0%,70%,100%{
    opacity:0;
  }

  72%{
    opacity:1;
  }

  74%{
    opacity:.2;
  }

  76%{
    opacity:1;
  }
}


/* =========================
   CAPTAIN SHIELD EFFECT
========================= */

.shieldGlow{
  position:absolute;

  width:190px;
  height:190px;

  border-radius:50%;

  border:5px solid rgba(255,255,255,.8);

  box-shadow:
    0 0 15px white,
    0 0 35px #4d8cff,
    0 0 70px #006eff,
    inset 0 0 30px #006eff;

  animation:shieldPulse 1.5s infinite alternate;
}

@keyframes shieldPulse{
  from{
    transform:scale(.9);
    opacity:.65;
  }

  to{
    transform:scale(1.12);
    opacity:1;
  }
}


/* =========================
   SPIDER WEB LIGHT
========================= */

.webGlow{
  position:absolute;

  width:300px;
  height:300px;

  border-radius:50%;

  background:
    repeating-radial-gradient(
      circle,
      transparent 0 20px,
      rgba(255,255,255,.25) 21px 22px
    );

  mask-image:
    radial-gradient(
      circle,
      black 0 55%,
      transparent 75%
    );

  animation:webSpin 5s linear infinite;

  opacity:.55;
}

@keyframes webSpin{
  to{
    transform:rotate(360deg);
  }
}


/* PARTICLES */
.particle{
  position:absolute;

  width:4px;
  height:4px;

  border-radius:50%;

  background:white;

  box-shadow:
    0 0 8px white,
    0 0 15px #00cfff;

  animation:particleMove 2.5s linear infinite;
}

@keyframes particleMove{

  0%{
    transform:translateY(80px) scale(.5);
    opacity:0;
  }

  30%{
    opacity:1;
  }

  100%{
    transform:translateY(-220px) scale(1.4);
    opacity:0;
  }
}


/* TITLE */
@keyframes titleIn{
  from{
    opacity:0;
    transform:translateY(40px);
    filter:blur(10px);
  }

  to{
    opacity:1;
    transform:translateY(0);
    filter:blur(0);
  }
}


/* MOBILE */
@media(max-width:700px){

  .content{
    padding:25px 20px 35px;
  }

  h1{
    font-size:58px;
  }

  .description{
    font-size:14px;
  }

  .stat{
    min-width:100px;
  }

  .energy{
    width:110px;
    height:110px;
  }

  .shieldGlow{
    width:130px;
    height:130px;
  }
}
</style>
</head>

<body>

<div class="hero-page">

  <!-- HERO IMAGE -->
  <div
    class="hero-image"
    id="heroImage">
  </div>

  <div class="overlay"></div>


  <!-- TOP -->
  <div class="top">

    <div class="logo">
      MCU BASELINE FAN HUB
    </div>

    <a
      class="back"
      href="hub.html">

      ← HUB

    </a>

  </div>


  <!-- SPECIAL EFFECTS -->

  <div
    class="energy"
    id="energy">

    <div class="rays"></div>

  </div>


  <div
    class="shieldGlow"
    id="shieldGlow">
  </div>


  <div
    class="webGlow"
    id="webGlow">
  </div>


  <div
    class="lightning"
    id="lightning">
  </div>


  <!-- PARTICLES -->
  <div class="particle p1"></div>
  <div class="particle p2"></div>
  <div class="particle p3"></div>
  <div class="particle p4"></div>
  <div class="particle p5"></div>


  <!-- CONTENT -->
  <main class="content">

    <div
      class="tag"
      id="heroTag">
      MARVEL HERO
    </div>

    <h1 id="heroTitle">
      IRON<br>MAN
    </h1>

    <p
      class="description"
      id="heroDescription">
      A brilliant engineer who uses advanced
      technology and powerful armor.
    </p>


    <div class="stats">

      <div class="stat">
        <small>POWER</small>
        <strong id="power">
          TECHNOLOGY
        </strong>
      </div>

      <div class="stat">
        <small>ARMOR</small>
        <strong id="armor">
          ADVANCED
        </strong>
      </div>

      <div class="stat">
        <small>STATUS</small>
        <strong id="status">
          ACTIVE
        </strong>
      </div>

    </div>

  </main>

</div>


<script>

const heroes = {

  iron:{
    title:"IRON<br>MAN",

    description:
      "A brilliant engineer who uses advanced technology, powerful armor and courage to protect others.",

    power:"TECHNOLOGY",
    armor:"ADVANCED",
    status:"ACTIVE",

    image:
      "https://rmd-legend.github.io/MCU-Baseline-Fan-Hub/HD-wallpaper-iron-man-avengers-ironman-marvel.jpg",

    effect:"iron"
  },


  spider:{
    title:"SPIDER<br>MAN",

    description:
      "A young hero known for agility, quick thinking and web-based movement.",

    power:"AGILITY",
    armor:"WEB GEAR",
    status:"ACTIVE",

    image:
      "https://rmd-legend.github.io/MCU-Baseline-Fan-Hub/spider_man_1_1_4.jpeg",

    effect:"spider"
  },


  captain:{
    title:"CAPTAIN<br>AMERICA",

    description:
      "A determined hero known for courage, leadership, strength and an iconic shield.",

    power:"STRENGTH",
    armor:"SHIELD",
    status:"ACTIVE",

    image:
      "https://rmd-legend.github.io/MCU-Baseline-Fan-Hub/images%20%281%29.jpeg",

    effect:"captain"
  },


  thor:{
    title:"THOR",

    description:
      "A powerful warrior associated with thunder, strength and a strong sense of duty.",

    power:"THUNDER",
    armor:"HAMMER",
    status:"ACTIVE",

    image:
      "https://rmd-legend.github.io/MCU-Baseline-Fan-Hub/images.jpeg",

    effect:"thor"
  }

};


/* GET HERO */

const params =
  new URLSearchParams(
    window.location.search
  );

const heroName =
  params.get("hero") || "iron";

const hero =
  heroes[heroName] || heroes.iron;


/* TEXT */

document.getElementById(
  "heroTitle"
).innerHTML = hero.title;

document.getElementById(
  "heroDescription"
).textContent =
  hero.description;

document.getElementById(
  "power"
).textContent =
  hero.power;

document.getElementById(
  "armor"
).textContent =
  hero.armor;

document.getElementById(
  "status"
).textContent =
  hero.status;


/* IMAGE */

document.getElementById(
  "heroImage"
).style.backgroundImage =
  'url("' + hero.image + '")';


/* EFFECT ELEMENTS */

const energy =
  document.getElementById("energy");

const shield =
  document.getElementById("shieldGlow");

const web =
  document.getElementById("webGlow");

const lightning =
  document.getElementById("lightning");


/* HIDE ALL */

energy.style.display = "none";
shield.style.display = "none";
web.style.display = "none";
lightning.style.display = "none";


/* IRON MAN */

if(hero.effect === "iron"){

  energy.style.display = "block";

  /*
  Change these two values if the
  light needs to move closer to
  Iron Man's hand.
  */

  energy.style.right = "28%";
  energy.style.bottom = "35%";

}


/* CAPTAIN AMERICA */

if(hero.effect === "captain"){

  shield.style.display = "block";

  shield.style.right = "27%";
  shield.style.bottom = "37%";

}


/* SPIDER-MAN */

if(hero.effect === "spider"){

  web.style.display = "block";

  web.style.right = "24%";
  web.style.bottom = "34%";

}


/* THOR */

if(hero.effect === "thor"){

  lightning.style.display = "block";

  lightning.style.right = "28%";
  lightning.style.bottom = "30%";

}


/* RANDOM PARTICLES */

const particles =
  document.querySelectorAll(".particle");

particles.forEach(
  (particle,index)=>{

    particle.style.left =
      (20 + Math.random()*60) + "%";

    particle.style.bottom =
      (10 + Math.random()*30) + "%";

    particle.style.animationDelay =
      (Math.random()*2) + "s";

  }
);

</script>

</body>
          </html>
