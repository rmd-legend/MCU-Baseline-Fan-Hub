<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hero | MCU Baseline Fan Hub</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    background:#02040a;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}


/* =========================
   HERO BACKGROUND
========================= */

.hero-page{
    position:relative;
    min-height:100vh;
    overflow:hidden;
    background:#02040a;
}

.hero-bg{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    background-position:center;
    background-size:cover;
    background-repeat:no-repeat;

    transform:scale(1.05);

    animation:bgZoom 12s ease-in-out infinite alternate;

    filter:saturate(1.1);
}

@keyframes bgZoom{

    from{
        transform:scale(1.05);
    }

    to{
        transform:scale(1.13);
    }

}


/* DARK OVERLAY */

.hero-page::before{
    content:"";

    position:absolute;
    inset:0;

    z-index:1;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.82),
            rgba(0,0,0,.35),
            rgba(0,0,0,.72)
        );
}


/* BOTTOM FADE */

.hero-page::after{
    content:"";

    position:absolute;
    left:0;
    right:0;
    bottom:0;

    height:45%;

    z-index:1;

    background:
        linear-gradient(
            transparent,
            #02040a
        );
}


/* =========================
   HEADER
========================= */

.header{
    position:absolute;

    top:0;
    left:0;
    right:0;

    z-index:20;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:22px 30px;
}

.logo{
    font-size:12px;
    letter-spacing:3px;
    font-weight:bold;
}

.back{
    color:white;
    text-decoration:none;

    padding:10px 20px;

    border:1px solid rgba(255,255,255,.3);
    border-radius:25px;

    background:rgba(0,0,0,.25);

    backdrop-filter:blur(10px);

    transition:.3s;
}

.back:hover{
    border-color:#20d9ff;

    box-shadow:
        0 0 20px rgba(32,217,255,.35);
}


/* =========================
   HERO CONTENT
========================= */

.hero-content{
    position:relative;

    z-index:10;

    min-height:100vh;

    max-width:1250px;

    margin:auto;

    padding:
        150px 40px
        130px;

    display:flex;

    align-items:center;
}

.info{
    width:55%;

    animation:contentIn 1s ease both;
}

@keyframes contentIn{

    from{
        opacity:0;
        transform:translateX(-50px);
    }

    to{
        opacity:1;
        transform:translateX(0);
    }

}

.tag{
    color:#20d9ff;

    font-size:12px;

    letter-spacing:5px;

    margin-bottom:15px;
}

.name{
    font-size:clamp(55px,9vw,115px);

    line-height:.9;

    letter-spacing:4px;

    font-weight:900;

    text-shadow:
        0 10px 40px rgba(0,0,0,.8);
}

.description{
    max-width:600px;

    color:#c1cad8;

    line-height:1.7;

    margin-top:25px;

    font-size:16px;
}

.abilities{
    display:flex;

    flex-wrap:wrap;

    gap:10px;

    margin-top:25px;
}

.ability{
    padding:9px 15px;

    border-radius:20px;

    border:1px solid rgba(255,255,255,.2);

    background:rgba(255,255,255,.06);

    backdrop-filter:blur(10px);

    color:#dbe6f5;

    font-size:12px;
}


/* MOVIES BUTTON */

.movies-btn{
    display:inline-flex;

    align-items:center;

    gap:10px;

    margin-top:35px;

    padding:14px 25px;

    border-radius:30px;

    background:#20d9ff;

    color:#001018;

    text-decoration:none;

    font-weight:bold;

    letter-spacing:1px;

    transition:.35s;

    box-shadow:
        0 0 25px rgba(32,217,255,.25);
}

.movies-btn:hover{

    transform:translateY(-4px);

    box-shadow:
        0 0 40px rgba(32,217,255,.5);

}


/* =========================
   CINEMATIC EFFECT AREA
========================= */

.power-effect{

    position:absolute;

    z-index:8;

    pointer-events:none;
}


/* IRON MAN */

.iron-effect{

    right:18%;

    bottom:32%;

    width:150px;

    height:150px;

    display:none;
}

.iron-effect::before{

    content:"";

    position:absolute;

    inset:35px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            white 0%,
            #7eeeff 18%,
            #20d9ff 40%,
            transparent 70%
        );

    box-shadow:
        0 0 25px #20d9ff,
        0 0 70px rgba(32,217,255,.8);

    animation:energyPulse .7s infinite alternate;
}

.iron-effect::after{

    content:"";

    position:absolute;

    width:260px;

    height:260px;

    left:-55px;

    top:-55px;

    border-radius:50%;

    border:2px solid rgba(32,217,255,.6);

    animation:ringSpin 2s linear infinite;
}


/* SPIDER-MAN */

.spider-effect{

    right:18%;

    bottom:35%;

    width:200px;

    height:200px;

    display:none;
}

.spider-effect::before,
.spider-effect::after{

    content:"";

    position:absolute;

    inset:0;

    border-radius:50%;

    background:
        repeating-conic-gradient(
            from 0deg,
            rgba(255,255,255,.8) 0deg 1deg,
            transparent 1deg 20deg
        );

    mask-image:radial-gradient(
        circle,
        transparent 0 20%,
        black 21% 100%
    );

    animation:webSpin 5s linear infinite;
}

.spider-effect::after{

    transform:rotate(45deg);

    opacity:.55;

    animation-direction:reverse;
}


/* CAPTAIN AMERICA */

.cap-effect{

    right:17%;

    bottom:28%;

    width:220px;

    height:220px;

    display:none;

    border-radius:50%;

    border:8px solid rgba(255,255,255,.8);

    box-shadow:
        0 0 0 18px rgba(190,20,30,.8),
        0 0 0 35px rgba(255,255,255,.8),
        0 0 0 52px rgba(20,70,180,.8),
        0 0 55px rgba(60,130,255,.8);

    animation:shieldSpin 5s linear infinite;
}

.cap-effect::after{

    content:"★";

    position:absolute;

    inset:0;

    display:grid;

    place-items:center;

    font-size:70px;

    color:white;

    text-shadow:
        0 0 20px #5ca9ff;
}


/* THOR */

.thor-effect{

    right:20%;

    top:28%;

    width:5px;

    height:350px;

    display:none;

    background:white;

    box-shadow:
        0 0 10px #fff,
        0 0 30px #62aaff,
        0 0 70px #2478ff;

    transform:rotate(12deg);

    animation:lightning .45s infinite alternate;
}


/* HULK */

.hulk-effect{

    right:18%;

    bottom:30%;

    width:200px;

    height:200px;

    display:none;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(120,255,120,.7),
            transparent 65%
        );

    filter:blur(3px);

    animation:energyPulse .6s infinite alternate;
}


/* DOCTOR STRANGE */

.strange-effect{

    right:17%;

    bottom:27%;

    width:240px;

    height:240px;

    display:none;

    border-radius:50%;

    border:4px solid #ff6a20;

    box-shadow:
        0 0 20px #ff4b18,
        inset 0 0 30px #ff4b18;

    animation:ringSpin 3s linear infinite;
}

.strange-effect::before,
.strange-effect::after{

    content:"";

    position:absolute;

    inset:20px;

    border-radius:50%;

    border:2px dashed rgba(255,170,50,.8);

    animation:ringSpin 2s linear infinite reverse;
}

.strange-effect::after{

    inset:55px;

    border:2px solid rgba(255,100,20,.8);
}


/* WANDA */

.wanda-effect{

    right:18%;

    bottom:30%;

    width:220px;

    height:220px;

    display:none;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,40,100,.7),
            transparent 65%
        );

    box-shadow:
        0 0 50px rgba(255,20,100,.7);

    animation:energyPulse .5s infinite alternate;
}


/* LOKI */

.loki-effect{

    right:20%;

    bottom:28%;

    width:200px;

    height:200px;

    display:none;

    border-radius:50%;

    border:3px solid #41ff88;

    box-shadow:
        0 0 35px #21ff72,
        inset 0 0 30px #21ff72;

    animation:ringSpin 4s linear infinite;
}


/* =========================
   ANIMATIONS
========================= */

@keyframes energyPulse{

    from{
        transform:scale(.85);
        opacity:.65;
    }

    to{
        transform:scale(1.15);
        opacity:1;
    }

}

@keyframes ringSpin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

@keyframes webSpin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

@keyframes shieldSpin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

@keyframes lightning{

    from{
        opacity:.2;
        transform:rotate(12deg) scaleY(.7);
    }

    to{
        opacity:1;
        transform:rotate(-8deg) scaleY(1.1);
    }

}


/* =========================
   MOVIE SECTION PREVIEW
========================= */

.movie-preview{

    position:relative;

    z-index:12;

    max-width:1250px;

    margin:auto;

    padding:0 40px 80px;
}

.movie-preview h2{

    font-size:20px;

    letter-spacing:3px;

    margin-bottom:10px;
}

.movie-preview p{

    color:#8490a2;

    font-size:13px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .header{
        padding:16px 18px;
    }

    .hero-content{

        padding:
            120px 22px
            100px;

        align-items:flex-end;
    }

    .info{
        width:100%;
    }

    .name{
        font-size:clamp(48px,16vw,80px);
    }

    .description{
        font-size:14px;
    }

    .power-effect{
        opacity:.55;
    }

    .iron-effect,
    .spider-effect,
    .cap-effect,
    .hulk-effect,
    .strange-effect,
    .wanda-effect,
    .loki-effect{

        right:5%;
        bottom:38%;
    }

    .thor-effect{
        right:15%;
        top:25%;
    }

    .movie-preview{
        padding-left:22px;
        padding-right:22px;
    }

}

</style>
</head>
