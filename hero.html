<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>MCU Hero | Fan Hub</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  background:#020305;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}


/* =========================
   HERO PAGE
========================= */

.hero-page{

  position:relative;

  min-height:100vh;
  min-height:100svh;

  display:flex;
  align-items:flex-end;

  overflow:hidden;
}


/* =========================
   HERO BACKGROUND IMAGE
========================= */

.hero-image{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  background-size:cover;

  background-position:center;

  background-repeat:no-repeat;

  z-index:0;
}


/* =========================
   CINEMATIC OVERLAY
========================= */

.overlay{

  position:absolute;

  inset:0;

  z-index:1;

  background:

    linear-gradient(
      90deg,
      rgba(0,0,0,.82),
      rgba(0,0,0,.35),
      rgba(0,0,0,.05)
    ),

    linear-gradient(
      0deg,
      rgba(0,0,0,.94),
      transparent 65%
    );
}


/* =========================
   TOP BAR
========================= */

.top{

  position:absolute;

  top:0;
  left:0;
  right:0;

  z-index:3;

  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:20px;
}


.logo{

  font-size:12px;

  letter-spacing:3px;

  color:#e8edf5;
}


.back{

  color:white;

  text-decoration:none;

  padding:10px 18px;

  border:1px solid rgba(255,255,255,.3);

  border-radius:25px;

  background:rgba(0,0,0,.4);

  transition:.3s;
}


.back:hover{

  background:rgba(255,255,255,.15);
}


/* =========================
   CONTENT
========================= */

.content{

  position:relative;

  z-index:2;

  width:100%;

  max-width:1100px;

  padding:60px;

  padding-bottom:80px;
}


/* =========================
   TAG
========================= */

.tag{

  color:#ffcf4a;

  font-size:13px;

  letter-spacing:5px;

  margin-bottom:15px;

  font-weight:bold;
}


/* =========================
   HERO TITLE
========================= */

h1{

  font-size:clamp(
    55px,
    11vw,
    120px
  );

  line-height:.9;

  letter-spacing:4px;

  margin-bottom:20px;

  text-shadow:
    0 5px 30px rgba(0,0,0,.9);
}


/* =========================
   DESCRIPTION
========================= */

.description{

  max-width:600px;

  color:#e0e5eb;

  font-size:17px;

  line-height:1.7;
}


/* =========================
   STATS
========================= */

.stats{

  display:flex;

  flex-wrap:wrap;

  gap:12px;

  margin-top:28px;
}


.stat{

  min-width:120px;

  padding:14px 18px;

  border-radius:14px;

  background:rgba(10,12,16,.65);

  border:1px solid rgba(255,255,255,.15);

  backdrop-filter:blur(8px);
}


.stat small{

  display:block;

  color:#9ba6b5;

  font-size:10px;

  letter-spacing:2px;

  margin-bottom:6px;
}


.stat strong{

  font-size:14px;
}


/* =========================
   BACK BUTTON
========================= */

.action{

  display:inline-block;

  margin-top:28px;

  padding:14px 25px;

  border-radius:30px;

  text-decoration:none;

  color:white;

  font-weight:bold;

  background:

    linear-gradient(
      90deg,
      #d71920,
      #ffb000
    );

  transition:.3s;
}


.action:hover{

  transform:translateY(-3px);
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .hero-image{

    background-position:center top;
  }


  .overlay{

    background:

      linear-gradient(
        0deg,
        rgba(0,0,0,.95),
        rgba(0,0,0,.45),
        rgba(0,0,0,.05)
      );
  }


  .top{

    padding:16px;
  }


  .content{

    padding:25px 20px 40px;
  }


  h1{

    font-size:58px;

    letter-spacing:2px;
  }


  .description{

    font-size:15px;
  }


  .stat{

    flex:1;

    min-width:105px;
  }

}

</style>

</head>


<body>


<div class="hero-page">


  <!-- HERO IMAGE -->

  <div
    class="hero-image"
    id="heroImage">
  </div>


  <!-- DARK OVERLAY -->

  <div class="overlay"></div>


  <!-- TOP BAR -->

  <div class="top">

    <div class="logo">

      MCU BASELINE FAN HUB

    </div>


    <a
      class="back"
      href="index.html">

      ← HUB

    </a>

  </div>


  <!-- HERO CONTENT -->

  <main class="content">


    <div
      class="tag"
      id="heroTag">

      MARVEL HERO

    </div>


    <h1
      id="heroTitle">

      IRON<br>MAN

    </h1>


    <p
      class="description"
      id="heroDescription">

      A brilliant engineer who uses advanced
      technology, powerful armor and courage
      to protect others.

    </p>


    <!-- STATS -->

    <div class="stats">


      <div class="stat">

        <small>
          POWER
        </small>

        <strong id="power">
          TECHNOLOGY
        </strong>

      </div>


      <div class="stat">

        <small>
          ARMOR
        </small>

        <strong id="armor">
          ADVANCED
        </strong>

      </div>


      <div class="stat">

        <small>
          STATUS
        </small>

        <strong id="status">
          ACTIVE
        </strong>

      </div>


    </div>


    <!-- BACK BUTTON -->

    <a
      class="action"
      href="index.html">

      ← BACK TO HEROES

    </a>


  </main>

</div>
